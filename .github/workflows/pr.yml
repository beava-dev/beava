name: PR Checks

on:
  pull_request:
    # No `synchronize` — pushing new commits does NOT auto-rerun the
    # heavy gate. A code owner must remove + re-add `ok-to-test` to
    # re-validate the new tip. Explicit re-approval per commit, no
    # CI burn from rapid pushes.
    types: [opened, reopened, labeled]
    branches: [main]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Default-deny GITHUB_TOKEN (OWASP / GitHub-Actions hardening guide).
# pr.yml runs read-only checks; no jobs need write access.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

# Heavy checks are gated behind the `ok-to-test` label, which only users
# with write access (i.e. code owners per .github/CODEOWNERS) can apply.
# PRs from the repo owner / org members with write access run the gate
# automatically. External contributors need a code owner to add the
# label after review.
#
# To run: as a code owner, click "Labels" on the PR sidebar → check
# `ok-to-test`. Workflow re-fires immediately (we're listening to the
# `labeled` activity type above).

jobs:
  rust:
    # Gate: nothing runs until a code owner adds `ok-to-test`.
    # Even owner-authored PRs need the label — explicit approval, no
    # implicit "same-repo trust." Re-fires automatically on `labeled`
    # per the trigger above.
    if: contains(github.event.pull_request.labels.*.name, 'ok-to-test')

    name: Rust (fmt, clippy, test, release build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: |
            rust-${{ runner.os }}-

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint with clippy
        # `--features testing` (not `--all-features`) per v0.0.0 scope: the
        # io_uring backend has pre-existing borrow-checker errors tracked as
        # v0.0.x backlog. Mirrors ci.yml's clippy gate exactly.
        run: cargo clippy --workspace --all-targets --features testing -- -D warnings

      - name: Run tests
        id: rust_tests
        # `--features testing` enables the gated tests under
        # crates/beava-server/Cargo.toml (`required-features = ["testing"]`)
        # without pulling in the broken io_uring backend. --test-threads=1
        # retained for serialized integration tests that bind ports.
        run: |
          cargo test --workspace --features testing -- --test-threads=1 2>&1 | tee /tmp/rust-test-output.txt
          echo "output<<EOF" >> "$GITHUB_OUTPUT"
          tail -5 /tmp/rust-test-output.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Verify release build
        run: cargo build --release

      - name: Add Rust summary
        if: always()
        run: |
          echo "## Rust Test Results" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -5 /tmp/rust-test-output.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "No test output captured" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  python:
    name: Python SDK tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: |
            rust-${{ runner.os }}-

      - name: Build Beava binary (needed by integration tests)
        run: cargo build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install pytest ruff mypy
          pip install -e python/

      - name: ruff check
        run: cd python && ruff check .

      - name: mypy --strict (advisory)
        # Drop continue-on-error once the codebase is green under strict.
        continue-on-error: true
        run: cd python && mypy beava

      - name: Run Python tests (verbose)
        id: python_tests
        run: |
          cd python && python -m pytest tests/ -v 2>&1 | tee /tmp/python-test-output.txt

      - name: Add Python summary
        if: always()
        run: |
          echo "## Python Test Results" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # Extract the summary line (last few lines of pytest output)
          tail -10 /tmp/python-test-output.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "No test output captured" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

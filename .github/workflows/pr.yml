name: PR Checks

on:
  pull_request:
    # `labeled` is in the trigger list so adding `ok-to-test` re-fires
    # the workflow without needing a fresh push.
    types: [opened, synchronize, reopened, labeled]
    branches: [main]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Default-deny GITHUB_TOKEN (OWASP / GitHub-Actions hardening guide).
# pr.yml runs read-only checks; no jobs need write access.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

# Heavy checks are gated behind the `ok-to-test` label, which only users
# with write access (i.e. code owners per .github/CODEOWNERS) can apply.
# PRs from the repo owner / org members with write access run the gate
# automatically. External contributors need a code owner to add the
# label after review.
#
# To run: as a code owner, click "Labels" on the PR sidebar → check
# `ok-to-test`. Workflow re-fires immediately (we're listening to the
# `labeled` activity type above).

jobs:
  rust:
    if: |
      github.event.pull_request.head.repo.full_name == github.repository
      || contains(github.event.pull_request.labels.*.name, 'ok-to-test')

    name: Rust (fmt, clippy, test, release build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: |
            rust-${{ runner.os }}-

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint with clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        id: rust_tests
        # --workspace + --all-features required: 50+ tests under
        # crates/beava-server/Cargo.toml gate on `required-features = ["testing"]`
        # and are silently skipped without --all-features. --test-threads=1 retained
        # for serialized integration tests that bind ports.
        run: |
          cargo test --workspace --all-features -- --test-threads=1 2>&1 | tee /tmp/rust-test-output.txt
          echo "output<<EOF" >> "$GITHUB_OUTPUT"
          tail -5 /tmp/rust-test-output.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Verify release build
        run: cargo build --release

      - name: Add Rust summary
        if: always()
        run: |
          echo "## Rust Test Results" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -5 /tmp/rust-test-output.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "No test output captured" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  python:
    name: Python SDK tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: |
            rust-${{ runner.os }}-

      - name: Build Beava binary (needed by integration tests)
        run: cargo build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install pytest
          pip install -e python/

      - name: Run Python tests (verbose)
        id: python_tests
        run: |
          cd python && python -m pytest tests/ -v 2>&1 | tee /tmp/python-test-output.txt

      - name: Add Python summary
        if: always()
        run: |
          echo "## Python Test Results" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # Extract the summary line (last few lines of pytest output)
          tail -10 /tmp/python-test-output.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "No test output captured" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

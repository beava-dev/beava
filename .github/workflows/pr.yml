name: PR Checks

# Standard OSS gating pattern (tokio / ruff / polars / arrow):
#
#   1. Code owner adds the `ok-to-test` label per CODEOWNERS — the gate.
#      `[labeled]` is the only auto-trigger, so adding the label fires
#      CI once. New commits do NOT auto-rerun: to revalidate a new tip,
#      a code owner removes + re-adds `ok-to-test` (one-shot semantics).
#
#   2. `workflow_dispatch` exists as a maintainer escape hatch — pass the
#      PR number to manually run against any labeled PR.
#
#   3. Repo Settings → Actions → General → "Fork pull request workflows
#      from outside collaborators" → "Require approval for all outside
#      collaborators" provides the second gate: GitHub's native "Approve
#      and run workflows" button shows up in the PR's Checks tab for
#      first-time / fork contributors and a maintainer must click before
#      any code from the fork executes.
#
# Job-level `if:` re-checks the label at run time, so removing the label
# revokes permission for in-flight runs too.
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to test (must have ok-to-test label)"
        required: true
        type: string

concurrency:
  group: pr-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

# Default-deny GITHUB_TOKEN (OWASP / GitHub-Actions hardening guide).
permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # Gate job: validates `ok-to-test` is present AT RUN TIME and resolves
  # the PR's head SHA. Both event types route through here so jobs below
  # check out the same SHA regardless of how they were triggered.
  gate:
    name: Verify ok-to-test label
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # For pull_request[labeled]: only the label-add we care about fires CI.
    # For workflow_dispatch: gate job validates the PR has the label set.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'ok-to-test'))
    outputs:
      head_sha: ${{ steps.lookup.outputs.head_sha }}
      pr_number: ${{ steps.lookup.outputs.pr_number }}
    steps:
      - name: Resolve PR head SHA + verify label (run-time recheck)
        id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            pr="${{ inputs.pr_number }}"
          else
            pr="${{ github.event.pull_request.number }}"
          fi
          json=$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" \
            --json labels,headRefOid,state)
          state=$(jq -r '.state' <<<"$json")
          if [[ "$state" != "OPEN" ]]; then
            echo "::error::PR #$pr is $state, refusing to run"
            exit 1
          fi
          if ! jq -e '.labels[] | select(.name == "ok-to-test")' <<<"$json" >/dev/null; then
            echo "::error::PR #$pr is missing the 'ok-to-test' label."
            echo "::error::A code owner must add it before this workflow can run."
            exit 1
          fi
          sha=$(jq -r '.headRefOid' <<<"$json")
          echo "head_sha=$sha" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr" >> "$GITHUB_OUTPUT"
          echo "✅ ok-to-test present; will test PR #$pr at $sha"

  rust:
    name: Rust (fmt, clippy, test, release build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: gate
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.head_sha }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: |
            rust-${{ runner.os }}-

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint with clippy
        # `--features testing` (not `--all-features`) per v0.0.0 scope: the
        # io_uring backend has pre-existing borrow-checker errors tracked as
        # v0.0.x backlog. Mirrors ci.yml's clippy gate exactly.
        run: cargo clippy --workspace --all-targets --features testing -- -D warnings

      - name: Run tests
        id: rust_tests
        # `--features testing` enables the gated tests under
        # crates/beava-server/Cargo.toml (`required-features = ["testing"]`)
        # without pulling in the broken io_uring backend. --test-threads=1
        # retained for serialized integration tests that bind ports.
        run: |
          cargo test --workspace --features testing -- --test-threads=1 2>&1 | tee /tmp/rust-test-output.txt
          echo "output<<EOF" >> "$GITHUB_OUTPUT"
          tail -5 /tmp/rust-test-output.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Verify release build
        run: cargo build --release

      - name: Add Rust summary
        if: always()
        run: |
          echo "## Rust Test Results" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -5 /tmp/rust-test-output.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "No test output captured" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  python:
    name: Python SDK tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [gate, rust]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.head_sha }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: |
            rust-${{ runner.os }}-

      - name: Build Beava binary (needed by integration tests)
        run: cargo build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install pytest ruff mypy
          pip install -e python/

      - name: ruff check
        run: cd python && ruff check .

      - name: mypy --strict (advisory)
        # Drop continue-on-error once the codebase is green under strict.
        continue-on-error: true
        run: cd python && mypy beava

      - name: Run Python tests (v0 acceptance suite via pyproject testpaths)
        id: python_tests
        run: |
          cd python && python -m pytest -v 2>&1 | tee /tmp/python-test-output.txt

      - name: Add Python summary
        if: always()
        run: |
          echo "## Python Test Results" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -10 /tmp/python-test-output.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "No test output captured" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

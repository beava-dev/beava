topic: "Beava's current market position — positioning lens per segment / competitor archetype"

# detail_level: brief (one line) | moderate (~paragraph) | detailed (multi-paragraph with examples)
# Fields merge the trimmed positioning lens (8) + 2 new 2025-2026-driven fields (oss_license_posture,
# hyperscaler_bundling_threat) + the `competition` category from ../beava-use-cases/fields.yaml
# (with `beava_differentiator` deduped into `beava_credible_wedge` and `where_beava_loses_today`
# deduped into `beava_disqualifiers`). Final count: 13 fields per item.
# Cross-reference: use_case_refs in outline.yaml point to items in ../beava-use-cases/outline.yaml;
# deep-research agents should consult ../beava-use-cases/results/*.json for grounding.

categories:

  competitive_landscape:
    description: "Who beava is up against in this segment and how the competition is shaped."
    fields:
      - name: incumbents
        description: "Who owns the segment today. Include generic streaming/feature-store competitors and any cross-cutting players (Redis+Lua, Flink, Materialize, RisingWave, Tecton-pre-acq, Feast, Chalk, Hopsworks, Aerospike, Valkey, RonDB)."
        detail_level: moderate
      - name: competitive_incumbent_per_domain
        description: "Domain-specific named incumbents for this exact segment (e.g., Sift/Forter for CNP payments; Persona/Socure for identity; Chainalysis/TRM for crypto; Subex/Mobileum for telecom; Cloudflare/Castle for bot). Include 2025-2026 funding/M&A status."
        detail_level: moderate
      - name: oss_license_posture
        description: "License of dominant incumbents in this segment: Apache-2.0 / BSL / proprietary / 'rug-pulled' (relicensed). With the Redis-Valkey split resolved in favor of Valkey (cloud-default, Ubuntu 26.04 ships it as the redis package), license posture is now a hard buyer filter — Beava's Apache-2.0 status is a real wedge against BSL competitors."
        detail_level: brief
      - name: hyperscaler_bundling_threat
        description: "Low / Medium / High. Whether a buyer in this segment can get a 'good enough' alternative bundled into a hyperscaler subscription they already pay for (Databricks-after-Tecton/Fennel, Redis Feature Form, Cloudflare Workers+DO, Stripe Radar AI). Most predictive single field for whether the segment is winnable by a single-binary OSS challenger."
        detail_level: moderate
      - name: integration_surface
        description: "Upstream producers expected by buyers in this segment (Kafka, Kinesis, Flink, Spark Real-Time Mode, mobile SDK direct push, gRPC, HTTP). Beava's HTTP/TCP-push model differs from Kafka-first feature stores — note where this is a fit and where it's a friction."
        detail_level: moderate
      - name: scoring_engine_coupling
        description: "Does the buyer plug beava into an external rules engine (Drools, FEEL, Snowflake), an ML scorer (XGBoost, ONNX, in-house Python), or both? Affects whether beava sits in the data path or the decisioning path."
        detail_level: brief

  beava_position_lens:
    description: "Where beava actually stands today in this segment and why it could win or not."
    fields:
      - name: beava_position_today
        description: "Honest current state: none | demo | early-traction | productized. 'Demo' = a runnable example exists; 'early-traction' = at least one external user; 'productized' = supported sales motion."
        detail_level: brief
      - name: beava_credible_wedge
        description: "Concrete reason a buyer in this segment would pick beava over the incumbent / hyperscaler bundle (sub-ms TCP latency, single binary at edge, 50+ primitives without ETL, Apache-2.0 with no open-core rug, deterministic in-memory state, sub-second WAL durability). Includes what was historically called `beava_differentiator`."
        detail_level: moderate
      - name: beava_disqualifiers
        description: "Concrete current gaps that block adoption in this segment (no TLS/auth in v0, no in-process sharding, in-memory only, no triggers, no multi-region active-active, no audit-grade retention, missing builtins). Be specific — these become the issue backlog. Includes what was historically called `where_beava_loses_today`."
        detail_level: moderate
      - name: time_to_credible_offering
        description: "Estimated months of engineering work for beava to be sellable in this segment (covering the disqualifiers above). Brief: '<1mo / 1-3mo / 3-6mo / 6-12mo / 12mo+'."
        detail_level: brief

  evidence_and_verdict:
    description: "Adoption signals today and the resulting recommendation."
    fields:
      - name: validation_signals_today
        description: "Public users, case studies, GitHub stars/forks, downloads, conference talks, runnable examples in beava's repo. Distinguish (a) does beava have proof points in this segment, from (b) does beava know who the buyer is. If neither, say so."
        detail_level: moderate
      - name: verdict
        description: "Lead / Compete / Watch / Avoid, plus one-line rationale. 'Lead' = pursue actively, this is a wedge; 'Compete' = credible play with work; 'Watch' = monitor, not a 12-month bet; 'Avoid' = wrong fit, don't chase."
        detail_level: brief
      - name: confidence
        description: "How grounded the assessment is: high (multiple 2025-2026 sources + repo evidence) / medium (mixed signal) / low (mostly extrapolation). Drives the per-item `uncertain` list."
        detail_level: brief

# Reserved: deep-research phase will populate `uncertain` per item for any field
# where 2025-2026 evidence was insufficient and assessment had to extrapolate.
uncertain: []

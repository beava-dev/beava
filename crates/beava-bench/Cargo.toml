[package]
name = "beava-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Beava v2 end-to-end throughput harness — drives a live beava server over HTTP+TCP and produces sustained EPS / latency / RSS numbers."
# Plan 13.7.6-32 consolidated the previous 4-binary cruft (beava-bench /
# beava-bench-legacy / beava-bench-v18 / beava-bench-v2) into a single
# canonical `beava-bench` binary with subcommands. v18's production harness
# lives in `harness::production`; `beava-bench throughput --parallel N`
# reproduces ledger numbers. `default-run` is self-referential now (only one
# bin remains post-Plan-32, but the field is harmless and avoids warnings if
# auxiliary bins are added in the future).
default-run = "beava-bench"

[dependencies]
beava-core = { path = "../beava-core" }
beava-server = { path = "../beava-server", features = ["testing"] }
beava-persistence = { path = "../beava-persistence" }
anyhow = { workspace = true }
clap = { workspace = true }
hdrhistogram = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "process"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
rmp-serde = { workspace = true }
thiserror = { workspace = true }
# Phase 13.5 Plan 08: humantime for --duration parsing; inquire for interactive walkthrough.
humantime = { workspace = true }
inquire = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# proptest powers Phase 19's blast_shape distribution tests.
proptest = { workspace = true }
# criterion powers the Phase 19-04 blast_shape microbench.
criterion = { workspace = true }
# Phase 13.5 Plan 08: CLI smoke tests spawn the built bench binary.
assert_cmd = { workspace = true }
predicates = { workspace = true }

[lib]
name = "beava_bench"
path = "src/lib.rs"

[[bin]]
name = "beava-bench"
path = "src/bin/beava-bench.rs"

[[bin]]
name = "memprofile"
path = "src/bin/memprofile.rs"

[[bench]]
name = "blast_shape_bench"
harness = false

[[bench]]
name = "cli_dispatch"
harness = false
